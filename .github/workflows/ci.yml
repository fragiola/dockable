# CI: the same three jobs in every Fragiola project repo.
#
#   Checks            Biome, TypeScript, the unit tests, the build and the Playwright suites.
#   Site export       fragiola.com builds /dockable from `pnpm site:export` (contract v1.2,
#                     fragiola/www CONTRACT.md), built and validated the way www's deploy runs
#                     it: it fails on anything www would reject.
#   Trigger www build after a push to main passes, asks fragiola/www to rebuild fragiola.com
#                     (a repository_dispatch of type "project-updated"). It needs the
#                     WWW_DISPATCH_TOKEN secret: a fine-grained token with Contents: read &
#                     write on fragiola/www. Without the secret the step is skipped, not failed.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Install Playwright Chromium
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report/
            examples/react/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /dockable --out "$RUNNER_TEMP/site-export"

  trigger-www-build:
    name: Trigger www build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, site-export]
    runs-on: ubuntu-latest
    env:
      WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch project-updated to fragiola/www
        if: env.WWW_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WWW_DISPATCH_TOKEN }}
        run: |
          gh api repos/fragiola/www/dispatches \
            -f event_type=project-updated \
            -f "client_payload[slug]=dockable" \
            -f "client_payload[sha]=$GITHUB_SHA"
