# CI: the Fragiola project jobs, with the Playwright suites split out of Checks.
#
#   Checks            Biome, TypeScript, the unit tests and the build (with the .d.ts check).
#   Package           `pnpm check:package`: builds and packs the packages with pnpm, lints the
#                     tarballs (dist-only exports, publint, attw), then installs them into a scratch
#                     Vite + React app outside the workspace that builds and loads its dev server.
#   E2E               the Playwright suites, in parallel jobs: the playground in two shards and
#                     the examples app. Native HTML5 drags flake under contention, so each
#                     machine keeps the configs' CI workers (1 and 2): the parallelism comes from
#                     the jobs and shards, not from workers. The playground's dev server serves
#                     the packages from source, so its jobs build nothing; the examples suite
#                     builds the embed against the packages' dist, so its job builds the packages.
#   Site export       fragiola.com builds /dockable from `pnpm site:export` (contract v1.2,
#                     fragiola/www CONTRACT.md), built and validated the way www's deploy runs
#                     it: it fails on anything www would reject.
#   Trigger www build on a push to main, asks fragiola/www to rebuild fragiola.com (a
#                     repository_dispatch of type "project-updated"). It needs the
#                     WWW_DISPATCH_TOKEN secret: a fine-grained token with Contents: read &
#                     write on fragiola/www. Without the secret the step is skipped, not failed.
#
# Tests run only on pull requests (and on a manual run). In this workflow, a push to main runs
# nothing but the www trigger: with one coordinator merging one PR at a time, main is what its PR
# tested. Revisit this when PRs merge concurrently (or from out-of-date branches): then main can
# differ from every tested head, and the checks should run again before the trigger (`needs`).
# The same push also runs release.yml: the Version Packages PR, or the npm publish (whose pack
# job runs `scripts/check-package.ts --tarballs` on the very tarballs it publishes).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  e2e:
    name: E2E (${{ matrix.name }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: playground 1/2
            id: playground-1
            package: playground
            dir: apps/playground
            args: --shard=1/2
          - name: playground 2/2
            id: playground-2
            package: playground
            dir: apps/playground
            args: --shard=2/2
          - name: examples
            id: examples
            package: examples-react
            dir: examples/react
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist (its playwright.config.ts).
      - name: Build the packages
        if: matrix.package == 'examples-react'
        run: pnpm --filter "./packages/*" build

      - name: Install Playwright Chromium
        working-directory: ${{ matrix.dir }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter ${{ matrix.package }} run e2e ${{ matrix.args }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: ${{ matrix.dir }}/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /dockable --out "$RUNNER_TEMP/site-export"

  trigger-www-build:
    name: Trigger www build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch project-updated to fragiola/www
        if: env.WWW_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WWW_DISPATCH_TOKEN }}
        run: |
          gh api repos/fragiola/www/dispatches \
            -f event_type=project-updated \
            -f "client_payload[slug]=dockable" \
            -f "client_payload[sha]=$GITHUB_SHA"
