# CI: the Fragiola project jobs, with the Playwright suites split out of Checks.
#
#   Checks            Biome, TypeScript, the unit tests and the build (with the .d.ts check).
#   Package           `pnpm check:package`: builds and packs every package with pnpm, lints the
#                     tarballs (dist-only exports, publint, attw), checks each adapter pins the
#                     core's exact version, then installs each adapter into its own scratch app
#                     outside the workspace (Vite + React for React) that builds and loads its dev
#                     server.
#   Changesets        on a pull request, `pnpm changeset status` fails when the PR changes what a
#                     package ships (`changedFilePatterns` in .changeset/config.json) without
#                     adding a changeset. Skipped for the Version Packages PR (changeset-release/*),
#                     which consumes them.
#   E2E               the Playwright suites, in parallel jobs: the playground in two shards, and
#                     one job per framework's examples app (every `examples/<framework>` with a
#                     playwright.config.ts, found by the Examples apps job), each running the
#                     shared specs of examples/shared/e2e against its own embed. Native HTML5
#                     drags flake under contention, so each machine keeps the configs' CI workers
#                     (1 and 2): the parallelism comes from the jobs and shards, not from workers.
#                     The playground's dev server serves the packages from source, so its jobs
#                     build nothing; an examples suite builds its embed against the packages'
#                     dist, so its job builds the packages.
#   Site export       fragiola.com builds /dockable from `pnpm site:export` (contract v1.2,
#                     fragiola/www CONTRACT.md), built and validated the way www's deploy runs
#                     it: it fails on anything www would reject.
#   Trigger www build on a push to main, asks fragiola/www to rebuild fragiola.com (a
#                     repository_dispatch of type "project-updated"). It needs the
#                     WWW_DISPATCH_TOKEN secret: a fine-grained token with Contents: read &
#                     write on fragiola/www. Without the secret the step is skipped, not failed.
#
# Tests run only on pull requests (and on a manual run). In this workflow, a push to main runs
# nothing but the www trigger: with one coordinator merging one PR at a time, main is what its PR
# tested. Revisit this when PRs merge concurrently (or from out-of-date branches): then main can
# differ from every tested head, and the checks should run again before the trigger (`needs`).
# The same push also runs release.yml: the Version Packages PR, or the npm publish (whose pack
# job runs `scripts/check-package.ts --tarballs` on the very tarballs it publishes).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the root's tools only (@changesets/cli): the check reads the packages' manifests and git
      - run: pnpm install --frozen-lockfile --filter "{.}"

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  e2e:
    name: E2E (${{ matrix.name }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: playground 1/2
            id: playground-1
            args: --shard=1/2
          - name: playground 2/2
            id: playground-2
            args: --shard=2/2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter playground run e2e ${{ matrix.args }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: apps/playground/playwright-report/
          retention-days: 14

  # The frameworks that have an examples app: every examples/<framework> with a playwright.config.ts
  # (examples/shared, the specs every framework runs, has none). Adding an app adds its job.
  examples-apps:
    name: Examples apps
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      frameworks: ${{ steps.list.outputs.frameworks }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          frameworks=$(ls examples/*/playwright.config.ts | cut -d/ -f2 | jq -Rnc '[inputs]')
          echo "frameworks=$frameworks" >> "$GITHUB_OUTPUT"
          echo "examples apps: $frameworks"

  e2e-examples:
    name: E2E (examples ${{ matrix.framework }})
    needs: examples-apps
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(needs.examples-apps.outputs.frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist (examplesE2eConfig).
      - name: Build the packages
        run: pnpm --filter "./packages/*" build

      - name: Install Playwright Chromium
        working-directory: examples/${{ matrix.framework }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter examples-${{ matrix.framework }} run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples-${{ matrix.framework }}
          path: examples/${{ matrix.framework }}/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /dockable --out "$RUNNER_TEMP/site-export"

  trigger-www-build:
    name: Trigger www build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch project-updated to fragiola/www
        if: env.WWW_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WWW_DISPATCH_TOKEN }}
        run: |
          gh api repos/fragiola/www/dispatches \
            -f event_type=project-updated \
            -f "client_payload[slug]=dockable" \
            -f "client_payload[sha]=$GITHUB_SHA"
