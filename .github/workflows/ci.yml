name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      # the docs export is built under the Pages base path, which its e2e
      # suite serves it under (apps/docs/playwright.config.ts)
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /dockable
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright Chromium
        working-directory: apps/playground
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report/
            apps/docs/playwright-report/
          retention-days: 14
